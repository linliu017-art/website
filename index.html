<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="我的个人主页，记录介绍、项目与生活。">
  <title>我的个人主页</title>
  <style>
    :root { color-scheme: light; --ink: #24332c; --muted: #69746d; --accent: #35674d; }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: #f7f6f1; color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; line-height: 1.8; }
    .container { width: min(900px, calc(100% - 48px)); margin: auto; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 28px 0; border-bottom: 1px solid #dfe3da; }
    .brand { font-weight: 700; letter-spacing: .04em; }
    nav { display: flex; gap: 24px; }
    a { color: var(--accent); text-underline-offset: 5px; }
    nav a { color: var(--muted); text-decoration: none; }
    a:hover { text-decoration: underline; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 5px; }
    .hero { padding: 100px 0 80px; }
    .eyebrow { color: var(--accent); font-size: 13px; letter-spacing: .16em; }
    h1 { margin: 18px 0 20px; font-size: clamp(40px, 7vw, 66px); line-height: 1.25; letter-spacing: -.04em; }
    .intro { max-width: 570px; color: var(--muted); font-size: 18px; }
    .button { display: inline-block; margin-top: 20px; padding: 10px 22px; border-radius: 6px; background: var(--accent); color: white; text-decoration: none; }
    section { padding: 38px 0; }
    h2 { margin: 0 0 20px; font-size: 24px; }
    p { margin: 0 0 16px; }
    .projects { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
    article { padding: 26px; border: 1px solid #dfe3da; border-radius: 12px; background: #fffefa; }
    article h3 { margin: 10px 0; font-size: 19px; }
    article p, .note { color: var(--muted); }
    .number { color: var(--accent); font-size: 13px; }
    footer { margin-top: 48px; padding: 24px 0; border-top: 1px solid #dfe3da; color: var(--muted); font-size: 13px; }
    @media (max-width: 580px) { .container { width: calc(100% - 36px); } header { gap: 16px; } nav { gap: 16px; font-size: 14px; } .hero { padding: 68px 0 44px; } .projects { grid-template-columns: 1fr; } }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <a class="brand" href="#home">我的主页</a>
      <nav aria-label="主导航">
        <a href="#about">关于</a>
        <a href="#projects">项目</a>
        <a href="#contact">联系</a>
      </nav>
    </header>
    <main id="home">
      <section class="hero" aria-labelledby="welcome">
        <span class="eyebrow">HELLO, WORLD</span>
        <!-- 将“你的名字”和下方介绍替换为你的个人信息。 -->
        <h1 id="welcome">你好，我是<br>你的名字。</h1>
        <p class="intro">欢迎来到我的个人空间。在这里，我分享正在做的项目、感兴趣的事，以及一路积累的思考。</p>
        <a class="button" href="#projects">看看我的项目 ↗</a>
      </section>
      <section id="about" aria-labelledby="about-title">
        <h2 id="about-title">关于我</h2>
        <p>在这里写一段自我介绍。可以聊聊你的职业、兴趣，以及你最近正在探索的方向。</p>
      </section>
      <section id="projects" aria-labelledby="projects-title">
        <h2 id="projects-title">我的项目</h2>
        <div class="projects">
          <article>
            <span class="number">01 / PROJECT</span>
            <h3>第一个项目</h3>
            <p>在这里介绍项目的想法、解决的问题，以及你参与的工作。</p>
          </article>
          <article>
            <span class="number">02 / PROJECT</span>
            <h3>下一个想法</h3>
            <p>在这里记录正在探索的方向，让新的想法慢慢成为作品。</p>
          </article>
        </div>
      </section>
      <section id="contact" aria-labelledby="contact-title">
        <h2 id="contact-title">保持联系</h2>
        <p class="note">你可以在这里添加自己的邮箱、GitHub 或其他社交主页链接。</p>
      </section>
    </main>
    <footer>我的个人主页 · 保持好奇，持续创造。</footer>
  </div>
</body>
</html>
